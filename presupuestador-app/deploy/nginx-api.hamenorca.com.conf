# Add these locations inside the existing api.hamenorca.com server block.
# This keeps Hermes Agent available on the rest of the domain.

location = /presupuestador {
    return 308 /presupuestador/;
}

location /presupuestador/ {
    proxy_pass http://127.0.0.1:4177/presupuestador/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

